[project]
name = "taxon"
version = "0.1.0"
description = "Catalog intelligence for AI shopping agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.4.0",
    "certifi>=2026.10.23",
    "google-genai>=2.34.0",
    "langfuse>=5.1.0",
    "mcp>=1",
    "numpy>=2.0",
    "openai>=3.44.0",
    "pillow>=13.0.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.5",
    "tokenizers>=0.21",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
quant = [
    "mlx-vlm>=0.7.12 ; sys_platform == 'darwin'",
]
train = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "matplotlib>=3.9",
    "peft>=0.21.2",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.1",
    "trl>=1.17.1",
]

[tool.uv]
default-groups = ["dev", "train"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taxon", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not data'"
markers = ["data: needs the pinned downloads produced by make reproduce"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
