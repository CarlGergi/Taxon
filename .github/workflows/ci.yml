# Lint and the offline tests on every push. No keys, no paid calls, no model downloads: the tests
# cannot reach the network (tests/conftest.py), and the ones that need real data are marked `data`
# and left out. Dependencies and the pinned Rust toolchain are installed before any test runs.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python lint and offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.14"
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          key: search-release
      - name: Build the search engine the tests use
        run: cargo build --release --locked --quiet -p taxon-search
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Offline tests
        run: uv run --frozen pytest -q
        env:
          CARGO_NET_OFFLINE: "true"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"

  rust:
    name: Rust lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --quiet -- -D warnings
      - name: Tests
        run: cargo test --locked --quiet
        env:
          CARGO_NET_OFFLINE: "true"
