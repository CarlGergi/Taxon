[package]
name = "taxon-search"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rmcp = { version = "3.8", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tantivy = "0.27"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
tempfile = "3.27.0"
